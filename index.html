<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dental Operatory: Clinical Rationale Simulator</title>
<style>
  :root {
    --primary: #991b1b;
    --accent: #ef4444;
    --success: #16a34a;
    --error: #dc2626;
    --bg: #0f172a;
    --surface: #1e293b;
    --text: #f8fafc;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    margin: 0;
    padding: 20px;
    background-color: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .game-container {
    width: 100%;
    max-width: 860px;
    background: var(--surface);
    border-radius: 16px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    overflow: hidden;
    border: 2px solid var(--primary);
  }
  .screen-header {
    background: #450a0a;
    padding: 16px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--primary);
  }
  .screen-header h2 {
    margin: 0;
    font-size: 1.1rem;
    color: #fca5a5;
  }
  .mode-switch {
    display: flex;
    gap: 8px;
  }
  .mode-btn {
    background: #7f1d1d;
    color: white;
    border: none;
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .mode-btn.active {
    background: var(--accent);
    color: white;
    font-weight: bold;
  }
  .workspace {
    display: grid;
    grid-template-columns: 1.15fr 1fr;
    min-height: 460px;
  }
  @media(max-width: 768px) {
    .workspace { grid-template-columns: 1fr; }
  }
  .tray-section {
    background: #0f172a;
    padding: 20px;
    border-right: 1px solid #334155;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .tray-section h3 {
    margin: 0 0 10px 0;
    font-size: 0.95rem;
    color: #fca5a5;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .item-pool {
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: 380px;
    overflow-y: auto;
    padding-right: 4px;
  }
  .draggable-item {
    background: #334155;
    border: 1px solid #475569;
    color: white;
    padding: 12px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
    text-align: left;
    transition: all 0.15s ease;
    line-height: 1.3;
  }
  .draggable-item:hover {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
    transform: translateX(3px);
  }
  .stage-section {
    padding: 20px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: #1e293b;
  }
  .visual-preview {
    width: 100%;
    height: 160px;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 14px;
    background: #000;
  }
  .visual-preview img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .narrative-prose {
    font-size: 0.95rem;
    line-height: 1.55;
    color: #e2e8f0;
    background: #0f172a;
    border-left: 3px solid #f87171;
    padding: 12px 14px;
    border-radius: 0 6px 6px 0;
    margin-bottom: 12px;
  }
  .call-to-action {
    font-size: 0.92rem;
    font-weight: 600;
    color: #fca5a5;
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .sublevel-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }
  .sublevel-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0f172a;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid #334155;
    font-size: 0.85rem;
  }
  .sublevel-row select {
    background: #1e293b;
    color: white;
    border: 1px solid #475569;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 0.85rem;
    max-width: 65%;
  }
  .feedback-banner {
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 0.85rem;
    font-weight: 600;
    display: none;
    margin-bottom: 10px;
    line-height: 1.45;
  }
  .feedback-banner.correct { background: var(--success); color: white; }
  .feedback-banner.incorrect { 
    background: #450a0a; 
    color: #fecaca; 
    border: 1px solid var(--accent);
  }
  .status-footer {
    font-size: 0.85rem;
    color: #fca5a5;
    display: flex;
    justify-content: space-between;
    font-weight: bold;
    border-top: 1px solid #334155;
    padding-top: 10px;
  }
  .submit-btn {
    background: #16a34a;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 6px;
    font-weight: bold;
    cursor: pointer;
    width: 100%;
    margin-top: 4px;
  }
  .submit-btn:hover { background: #15803d; }
</style>
</head>
<body>

<div class="game-container">
  <div class="screen-header">
    <h2 id="header-title">Clinical Competency: Infection Control Simulator</h2>
    <div class="mode-switch">
      <button class="mode-btn active" id="mode-btn-setup" onclick="switchMode('setup')">Unit Setup</button>
      <button class="mode-btn" id="mode-btn-breakdown" onclick="switchMode('breakdown')">Unit Breakdown</button>
    </div>
  </div>

  <div class="workspace">
    <!-- Left Panel: Actions -->
    <div class="tray-section">
      <h3 id="panel-title">Available Actions</h3>
      <div class="item-pool" id="item-pool"></div>
    </div>

    <!-- Right Panel: Narrative & Progression -->
    <div class="stage-section">
      <div>
        <div class="visual-preview">
          <img id="stage-img" src="" alt="Operatory View">
        </div>
        <div class="narrative-prose" id="narrative-box">
          Loading scenario...
        </div>
        <div class="call-to-action" id="prompt-question">
          What is your immediate next action?
        </div>
        <div id="dynamic-sublevel-area"></div>
        <div id="feedback" class="feedback-banner"></div>
      </div>

      <div class="status-footer">
        <span id="step-counter">Step 1 of X</span>
        <span id="strike-counter" style="color: #ef4444;">FATAL ERROR: 0 / 1</span>
      </div>
    </div>
  </div>
</div>

let currentMode = 'setup';
let currentIndex = 0;
let failed = false;

function switchMode(mode) {
  currentMode = mode;
  currentIndex = 0;
  failed = false;
  document.getElementById('mode-btn-setup').classList.toggle('active', mode === 'setup');
  document.getElementById('mode-btn-breakdown').classList.toggle('active', mode === 'breakdown');
  document.getElementById('header-title').innerText = mode === 'setup' 
    ? 'Clinical Competency: Setup (Narrative Mode)' 
    : 'Clinical Competency: Breakdown (Narrative Mode)';
  loadStep();
}

function loadStep() {
  if (failed) return;
  const list = protocols[currentMode];
  if (currentIndex >= list.length) {
    document.getElementById('narrative-box').innerHTML = `🏆 <strong>COMPETENCY EVALUATION COMPLETE: PASSED WITH DISTINCTION.</strong><br><br>You executed every single phase of clinical asepsis in flawless order. Your instructor signs off on your clinical record!`;
    document.getElementById('prompt-question').innerText = "Exam signed and submitted.";
    document.getElementById('panel-title').innerText = "Competency Sign-Off";
    document.getElementById('item-pool').innerHTML = `<button class="draggable-item" onclick="switchMode('${currentMode}')" style="background:var(--success);text-align:center;font-weight:bold;">Retake This Clinical Protocol</button>`;
    document.getElementById('stage-img').src = "https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=600&q=80";
    document.getElementById('dynamic-sublevel-area').innerHTML = '';
    return;
  }

  const step = list[currentIndex];
  document.getElementById('stage-img').src = step.img;
  document.getElementById('narrative-box').innerHTML = step.story;
  document.getElementById('prompt-question').innerHTML = step.type === 'single'
    ? "What is your immediate next action to maintain asepsis?"
    : "Select the exact sequence to maintain infection control:";
  
  document.getElementById('step-counter').innerText = `Step ${currentIndex + 1} of ${list.length}`;
  document.getElementById('strike-counter').innerText = `FATAL ERROR: 0 / 1 (Instant Fail Active)`;
  document.getElementById('feedback').style.display = 'none';
  document.getElementById('dynamic-sublevel-area').innerHTML = '';

  const poolContainer = document.getElementById('item-pool');
  poolContainer.innerHTML = '';

  if (step.type === 'single') {
    document.getElementById('panel-title').innerText = "Choose Next Clinical Action";

    const singleSteps = list.filter(item => item.type === 'single');
    let pool = [step.text];
    let attempts = 0;
    while (pool.length < Math.min(4, singleSteps.length) && attempts < 50) {
      attempts++;
      let randomItem = singleSteps[Math.floor(Math.random() * singleSteps.length)].text;
      if (!pool.includes(randomItem)) {
        pool.push(randomItem);
      }
    }
    pool.sort(() => Math.random() - 0.5);

    pool.forEach(itemText => {
      const btn = document.createElement('button');
      btn.className = 'draggable-item';
      btn.innerText = itemText;
      btn.onclick = () => checkSingle(itemText, step.text);
      poolContainer.appendChild(btn);
    });
  } else if (step.type === 'sublevel') {
    document.getElementById('panel-title').innerText = "Sequencing Console";

    let shuffledItems = [...step.items].sort(() => Math.random() - 0.5);

    let htmlContent = `<div class="sublevel-container">`;
    step.items.forEach((_, idx) => {
      htmlContent += `
        <div class="sublevel-row">
          <span>Position #${idx + 1}</span>
          <select id="sub-select-${idx}">
            <option value="">-- Select Item --</option>
            ${shuffledItems.map(item => `<option value="${item.replace(/"/g, '&quot;')}">${item}</option>`).join('')}
          </select>
        </div>`;
    });
    htmlContent += `</div><button class="submit-btn" onclick="checkSublevel()">Submit Sequence to Proctor</button>`;
    
    document.getElementById('dynamic-sublevel-area').innerHTML = htmlContent;
    poolContainer.innerHTML = `<div style="color:#94a3b8; font-size:0.85rem; padding:10px; line-height:1.4;">Lock in the exact order for this multi-step clinical barrier on the right panel.</div>`;
  }
}

function checkSingle(selected, correct) {
  if (failed) return;
  const fb = document.getElementById('feedback');
  fb.style.display = 'block';

  if (selected === correct) {
    fb.className = 'feedback-banner correct';
    fb.innerText = "✓ Sequence approved by instructor. Moving to next phase...";
    currentIndex++;
    setTimeout(() => { loadStep(); }, 900);
  } else {
    triggerFail();
  }
}

function checkSublevel() {
  if (failed) return;
  const step = protocols[currentMode][currentIndex];
  let userOrder = [];
  
  for (let i = 0; i < step.items.length; i++) {
    const el = document.getElementById(`sub-select-${i}`);
    if (!el || !el.value) {
      const fb = document.getElementById('feedback');
      fb.style.display = 'block';
      fb.className = 'feedback-banner incorrect';
      fb.innerText = "You must assign an item to every position in the sequence!";
      return;
    }
    userOrder.push(el.value);
  }

  const uniqueItems = new Set(userOrder);
  if (uniqueItems.size !== step.items.length) {
    const fb = document.getElementById('feedback');
    fb.style.display = 'block';
    fb.className = 'feedback-banner incorrect';
    fb.innerText = "Duplicate detected! Each protective item can only be placed once.";
    return;
  }

  let isCorrect = true;
  for (let i = 0; i < step.items.length; i++) {
    if (userOrder[i] !== step.items[i]) {
      isCorrect = false;
      break;
    }
  }

  const fb = document.getElementById('feedback');
  fb.style.display = 'block';

  if (isCorrect) {
    fb.className = 'feedback-banner correct';
    fb.innerText = "✓ Exact barrier sequence verified. Protocol intact.";
    currentIndex++;
    setTimeout(() => { loadStep(); }, 1100);
  } else {
    triggerFail();
  }
}

function triggerFail() {
  failed = true;
  const step = protocols[currentMode][currentIndex];
  const fb = document.getElementById('feedback');
  fb.style.display = 'block';
  fb.className = 'feedback-banner incorrect';
  
  // Highlighting specific clinical risk rationale
  fb.innerHTML = `<strong>❌ CRITICAL BREACH OF ASEPSIS — EXAM FAILED</strong><br><br><em>Clinical Consequence:</em> ${step.riskRationale}`;
  
  document.getElementById('strike-counter').innerText = `FATAL ERROR: 1 / 1 (FAILED)`;
  document.getElementById('stage-img').src = "https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?auto=format&fit=crop&w=600&q=80";
  document.getElementById('dynamic-sublevel-area').innerHTML = '';
  document.getElementById('prompt-question').innerText = "Competency stopped by instructor.";
  
  document.getElementById('item-pool').innerHTML = `
    <div style="text-align:center; padding: 10px;">
      <p style="color:#fca5a5; font-weight:bold; margin-bottom:10px; font-size:0.85rem;">One mistake means a zero on the competency evaluation.</p>
      <button class="draggable-item" onclick="switchMode('${currentMode}')" style="background:var(--accent);text-align:center;font-weight:bold; width:100%;">Restart Competency From Step 1</button>
    </div>`;
}

loadStep();
</script>
